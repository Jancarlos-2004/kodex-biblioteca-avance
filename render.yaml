services:
  - type: web
    name: kodex-biblioteca-avance
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      # Reutiliza la BD creada por el proyecto final.
      # connectionString de Render no es vÃ¡lido para JDBC, se usan datos separados.
      - key: PGHOST
        fromDatabase:
          name: kodex-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: kodex-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: kodex-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: kodex-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: kodex-db
          property: password

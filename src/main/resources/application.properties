# ===================================================================
# KODEX - Configuración del Sistema de Gestión de Biblioteca (MySQL)
# ===================================================================
spring.application.name=kodex-biblioteca
server.port=8094
server.servlet.context-path=/

# -------------------------------------------------------------------
# Conexión a Base de Datos MySQL
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/kodex_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Configuración JPA / Hibernate
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Configuración Thymeleaf
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.kodex=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
